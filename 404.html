/* chip group; the first render takes the start choice from initR (-1 = none chosen); unk = the index of a "Nežinau"
   option (quiet chosen style, left out of the e-mail) */
function radios(box,name,arr,unk){
  const el=$(box),cur=el.querySelector("input:checked"),idx=cur?+cur.value:el.children.length?-1:(initR[name]!=null?initR[name]:0);
  el.innerHTML=arr.map((a,i)=>`<label class="opt${i===unk?" unk":""}"><input type="radio" name="${name}" value="${i}"${i===idx?" checked":""}><span>${esc(a)}</span></label>`).join("");
}

/* ---------- request list ---------- */
function qtyHTML(l,n){
  const d=D();
  return `<div class="step" role="group" aria-label="${esc(n)}"><button type="button" data-act="dec" data-k="${l.k}" data-l="${l.id}" aria-label="${esc(d.qtyDec+": "+n)}">${ui("u-minus")}</button><output>${l.q} ${esc(d.unit)}</output><button type="button" data-act="inc" data-k="${l.k}" data-l="${l.id}" aria-label="${esc(d.qtyInc+": "+n)}">${ui("u-plus")}</button></div>`;
}
/* card: "Į sąrašą" (opens the parameter sheet) · one line: its stepper + "Parametrai" · several lines: a summary that
   opens the list; "Kitas variantas" adds the same item with other parameters */
function actHTML(k){
  const d=D(),ls=linesOf(k),n=itemName(k);
  if(!ls.length)return `<button type="button" class="btn btn-p add" data-act="add" data-k="${k}" aria-label="${esc(d.addAria+n)}">${ui("u-plus")}<span>${esc(d.add)}</span></button>`;
  const u=unitsOf(k),sum=`${u} ${d.unit} · ${ls.length} ${pl(ls.length,d.variants)}`;
  const main=ls.length===1?qtyHTML(ls[0],n):`<button type="button" class="btn btn-q vsum" data-act="open" data-k="${k}" aria-label="${esc(d.vsumAria+n+", "+sum)}">${esc(sum)}</button>`;
  return main+`<div class="it-x">${ls.length===1?`<button type="button" class="lnk" data-act="cfg" data-k="${k}" data-l="${ls[0].id}" aria-label="${esc(d.parAria+n)}">${esc(d.parBtn)}</button>`:""}<button type="button" class="lnk" data-act="var" data-k="${k}" aria-label="${esc(d.varAria+n)}">${esc(d.varBtn)}</button></div>`;
}
function rowHTML(l){
  const d=D(),c=catOf(l.k),i=+l.k.split("-")[1],nm=lname(l),s=parSum(l);
  return `<li class="drow"><span class="dthumb" aria-hidden="true">${art(c,i)}</span><div class="db"><small>${nn(c)} ${esc(d.sol[c][0])}</small><strong>${esc(itemName(l.k))}</strong>`+
    (s.length?`<p class="dpar">${esc(s.join(", "))}</p>`:"")+`<button type="button" class="lnk dpar-b" data-act="cfg" data-k="${l.k}" data-l="${l.id}" aria-label="${esc((s.length?d.parEditAria:d.parSetAria)+nm)}">${esc(s.length?d.parEdit:d.parSet)}</button>`+
    `<div class="drow-a">${qtyHTML(l,nm)}<button type="button" class="rm" data-act="rm" data-k="${l.k}" data-l="${l.id}" aria-label="${esc(d.remove+": "+nm)}">${esc(d.remove)}</button></div></div></li>`;
}
function syncList(k){
  const d=D(),units=cart.reduce((a,l)=>a+l.q,0),n=cart.length;
  const b=$("#badge");b.textContent=String(n);b.classList.toggle("zero",!n);
  $("#lbV").textContent=cnt(n);

  $$(".it-a").forEach(sl=>{if(!k||sl.dataset.k===k)sl.innerHTML=actHTML(sl.dataset.k)});
  $$(".tick").forEach(tk=>{const q=unitsOf(tk.dataset.tk);tk.hidden=!q;tk.innerHTML=q?`${ui("u-check")}${q}`:""});
  $$(".in-list").forEach(btn=>{const c=+btn.dataset.c,m=cart.filter(l=>catOf(l.k)===c).length;btn.hidden=!m;btn.querySelector("b").textContent=String(m);btn.setAttribute("aria-label",`${d.inList}: ${cnt(m)}, ${d.listAria}`)});
  $("#dList").innerHTML=cart.map(rowHTML).join("");

  const sum=`${cnt(n)}, ${units} ${d.unit}`;

function go(sel,focusSel){
  /* a focus target ("Tęsti užklausą" → "Ko reikia?") is scrolled to the middle of the screen, never below the fold */
  const el=$(sel),fs=focusSel&&$(focusSel),ln=window.baLenis;
  if(ln&&!ln.isStopped){const t=fs||el,h=$("#hdr").offsetHeight;ln.scrollTo(t,{offset:fs?-(innerHeight-t.offsetHeight)/2:-(h+16)})}
  else try{(fs||el).scrollIntoView({behavior:reduce()?"auto":"smooth",block:fs?"center":"start"})}catch(e){}
  const f=focusSel?$(focusSel):el.querySelector(".add,.step button");if(f)f.focus({preventScroll:true});
}

/* ---------- parameter sheet (dialog #cfg): add a line (from a card) or change one (card or drawer) ---------- */
function renderCfg(){
  const d=D(),s=cfgS,k=s.k,c=catOf(k),i=+k.split("-")[1];
  $("#cfgArt").innerHTML=art(c,i);
  $("#cfgL").textContent=`${nn(c)}.${i+1} · ${d.sol[c][0]}`;
  $("#cfgT").textContent=itemName(k);
  let h="",row=[];
  /* number fields two per row (a single one keeps the half width, a "solo" field gets a row of its own); a single text
     field takes the whole width; the "Nežinau – parinkite" chip has its own quiet chosen style (.unk) */
  const flush=()=>{if(row.length)h+=row.length>1||row.t!=="s"?`<div class="c-row">${row.join("")}</div>`:row[0];row=[]};
  SPEC[k].forEach(id=>{const f=PF[id],L=pfL(f),v=s.p[id];
    if(f.t==="c"){flush();h+=`<fieldset class="c-g"><legend>${esc(L[0])}</legend><div class="opts">${[d.unk].concat(L[2]).map((o,j)=>`<label class="opt${j?"":" unk"}"><input type="radio" name="cf-${id}" value="${j}"${(v||0)===j?" checked":""}><span>${esc(o)}</span></label>`).join("")}</div></fieldset>`;return}

const DTXT={co:120,person:80,phone:40,zip:12,city:60,vat:20,need:4000,pMaker:60,pModel:60,pSerial:60,pYear:4,pProb:4000};

/* a stored draft is read before the first render: only known fields with plain values, cut to the field lengths */
