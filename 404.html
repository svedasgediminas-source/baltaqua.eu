<script>
/* BaltAqua "Išvaizda" – runs first in <head>, before the stylesheet: applies the look saved in localStorage "ba-look"
   to <html> before the first paint (no flash of the white theme). With nothing stored nothing is touched: the page stays
   white even when the OS is in dark mode. Exposes window.BALook (shared with the panel script at the end of <body>). */
(function () {
  "use strict";
  var root = document.documentElement;
  /* theme -> [page background (meta theme-color), color-scheme]; generated by src/palette.js --head */
  var THEMES = {"light":["#FFFFFF","light"],"paper":["#F2EEE6","light"],"ice":["#E8EFF3","light"],"dune":["#ECE4D3","light"],"fog":["#E9ECEB","light"],"dark":["#0E1A22","dark"],"sea":["#0B1622","dark"],"contrast":["#FFFFFF","light"]};
  var DEF = { theme: "light", accent: "water", size: "m", density: "comfy", map: true, motion: "auto" };
  var OPT = {
    theme: ["light", "paper", "ice", "dune", "fog", "dark", "sea", "contrast"],
    accent: ["water", "fjord", "reed", "float", "graphite"],
    size: ["m", "lg", "xl"],
    density: ["comfy", "compact"],
    motion: ["auto", "reduce"]
  };
  var KEY = "ba-look";

  function norm(o) {
    var s = {}, k;
    o = o && typeof o === "object" && !Array.isArray(o) ? o : {};
    for (k in DEF) s[k] = DEF[k];
    for (k in OPT) if (OPT[k].indexOf(o[k]) >= 0) s[k] = o[k];
    if (o.map === false) s.map = false;
    return s;
  }
  function read() {
    try { return norm(JSON.parse(localStorage.getItem(KEY) || "null")); } catch (e) { return norm(null); }
  }
  function isDefault(s) { for (var k in DEF) if (s[k] !== DEF[k]) return false; return true; }
  function write(s) {
    try { if (isDefault(s)) localStorage.removeItem(KEY); else localStorage.setItem(KEY, JSON.stringify(s)); return true; } catch (e) { return false; }
  }
  function attr(n, v) { if (v) root.setAttribute(n, v); else root.removeAttribute(n); }
  function meta(n, v) { var m = document.querySelector('meta[name="' + n + '"]'); if (m && m.content !== v) m.content = v; }
  var cur = norm(null);
  function apply(s) {
    cur = norm(s);
    var t = THEMES[cur.theme] || ["#FFFFFF", "light"];
    root.setAttribute("data-theme", cur.theme);
    attr("data-accent", cur.accent !== DEF.accent && cur.accent);
    attr("data-zoom", cur.size !== DEF.size && cur.size);
    attr("data-density", cur.density !== DEF.density && cur.density);
    attr("data-map", !cur.map && "off");
    attr("data-motion", cur.motion !== DEF.motion && cur.motion);
    /* the metas sit above this script in <head> */
    meta("color-scheme", t[1]);
    meta("theme-color", t[0]);
    return norm(cur);
  }
  function osReduce() { try { return !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches); } catch (e) { return false; } }

  window.BALook = { key: KEY, DEF: DEF, OPT: OPT, THEMES: THEMES, norm: norm, read: read, write: write, apply: apply, isDefault: isDefault, osReduce: osReduce, get: function () { return norm(cur); } };

  var s = read();
  if (isDefault(s)) { cur = s; return; } /* nothing stored: leave the page exactly as it is */
  apply(s);
})();
/* page-load moment (GSAP, end of <body>): the headline and the pond plan wait hidden for at most 2.5 s; with reduced
   motion, or when the animation library does not arrive in time, everything is simply shown */
(function () {
  var r = document.documentElement;
  try { if (r.getAttribute("data-motion") === "reduce" || matchMedia("(prefers-reduced-motion: reduce)").matches) return; } catch (e) { return; }
  r.classList.add("ba-intro");
  window.__baIntroT = setTimeout(function () { r.classList.remove("ba-intro"); }, 2500);
})();
</script>

:root{
  --bg:#FFFFFF; --bg-2:#F0F4F6; --surface:#FFFFFF; --raise:#FFFFFF;
  --tile:#FFFFFF; --tile-line:#DCE3E7; --d-ink:#18303F; --d-aux:#7D8E99;
  --ink:#142430; --ink-2:#3E4F5B; --ink-3:#55656F;
  --line:#DCE3E7; --line-2:#C2CDD4; --field:#7A8994;
  --accent:#14598A; --accent-hi:#0F4A74; --accent-tx:#14598A; --on-accent:#FFFFFF;
  --water:rgba(20,89,138,.08); --earth:#EEF2F4; --water-ln:#1F6FA8; --lk-brand:#14598A;
  --depth:#1F6FA8; --depth-o:.085;
  --sig:#E8A317; --on-sig:#142430;
  --err:#B3261E;
  --map:#1C4866; --map-o:.2; --map-oi:.38; --map-o0:.58;
  --scrim:rgba(10,22,32,.46);
  --foot:#10263A; --foot-ink:#E6EDF2; --foot-ink-2:#A9B9C5; --foot-line:rgba(230,237,242,.16);
  --focus:#142430;
  --fh:"Bitter",Georgia,"Times New Roman",serif;
  --fb:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:4px; --r-s:3px;
  --gut:16px; --maxw:1360px;
  --t:160ms; --ease:cubic-bezier(.2,.6,.2,1);
  color-scheme:light;
}
/* dark tokens: used when the visitor picks "Naktis" / "Jūra" in Išvaizda (the page itself is pinned to light) */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A22; --bg-2:#122029; --surface:#15252F; --raise:#1A2C37;
    --tile:#13222B; --tile-line:#263843; --d-ink:#D5E1E8; --d-aux:#7891A0;
    --ink:#E3EAEE; --ink-2:#B0BEC7; --ink-3:#93A3AE;
    --line:#20323D; --line-2:#33474F; --field:#6F8593;
    --accent:#2A73A8; --accent-hi:#26699A; --accent-tx:#8CC3EA; --on-accent:#FFFFFF;
    --water:rgba(140,195,234,.09); --earth:#14242E; --water-ln:#8CC3EA; --lk-brand:#2A73A8;
    --depth:#8CC3EA; --depth-o:.07;
    --err:#F28B9E;
    --map:#CFE0EA; --map-o:.12; --map-oi:.22; --map-o0:.36;
    --scrim:rgba(0,0,0,.6);
    --foot:#08121A; --foot-ink:#E3EAEE; --foot-ink-2:#95A6B2; --foot-line:rgba(227,234,238,.12);
    --focus:#E3EAEE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A22; --bg-2:#122029; --surface:#15252F; --raise:#1A2C37;
  --tile:#13222B; --tile-line:#263843; --d-ink:#D5E1E8; --d-aux:#7891A0;
  --ink:#E3EAEE; --ink-2:#B0BEC7; --ink-3:#93A3AE;
  --line:#20323D; --line-2:#33474F; --field:#6F8593;
  --accent:#2A73A8; --accent-hi:#26699A; --accent-tx:#8CC3EA; --on-accent:#FFFFFF;
  --water:rgba(140,195,234,.09); --earth:#14242E; --water-ln:#8CC3EA; --lk-brand:#2A73A8;
  --depth:#8CC3EA; --depth-o:.07;
  --err:#F28B9E;
  --map:#CFE0EA; --map-o:.12; --map-oi:.22; --map-o0:.36;
  --scrim:rgba(0,0,0,.6);
  --foot:#08121A; --foot-ink:#E3EAEE; --foot-ink-2:#95A6B2; --foot-line:rgba(227,234,238,.12);
  --focus:#E3EAEE;
  color-scheme:dark;
}
@media (min-width:760px){:root{--gut:24px}}
@media (min-width:1100px){:root{--gut:32px}}

/* ===== base ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--hdr-h,72px) + 16px)}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
html.lock{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--fb);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overflow-x:clip}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure,fieldset{margin:0}
ul,ol{padding:0;list-style:none}
fieldset{border:0;padding:0;min-width:0}
legend{padding:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img,svg{display:block}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 var(--gut)}
.ui{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lab{font:600 13.5px/1.3 var(--fb);letter-spacing:0;color:var(--ink-3)}
h1,h2,h3{text-wrap:balance}
.skip{position:absolute;left:var(--gut);top:-60px;z-index:100;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:var(--r);font-weight:600;text-decoration:none;transition:top var(--t)}
.skip:focus{top:8px}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:var(--r);border:1px solid transparent;font:600 15.5px/1.1 var(--fb);letter-spacing:0;text-decoration:none;white-space:nowrap;transition:background-color var(--t),border-color var(--t),color var(--t)}
.btn .ui{width:18px;height:18px}
.btn-p{background:var(--accent);color:var(--on-accent)}
.btn-p:hover{background:var(--accent-hi)}
.btn-g{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-g:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.btn-q{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn-q:hover{border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lnk{background:none;border:0;padding:0;color:var(--ink);font:inherit;font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.lnk:hover{text-decoration-color:currentColor}

/* ===== utility bar ===== */
.util{border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.util .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:38px}
.util ul{display:flex;gap:28px;min-width:0}
.util li{display:flex;align-items:center;gap:8px;white-space:nowrap}
.util li .ui{width:17px;height:17px;color:var(--ink)}
.util .u-short{display:none}
.sis{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink);font-weight:600;font-size:13px}
.sis .ui{width:14px;height:14px}
.sis:hover span{text-decoration:underline;text-underline-offset:3px}
@media (max-width:1099px){.util li.u-3{display:none}}
@media (max-width:979px){.util li.u-2{display:none}}
@media (max-width:759px){
  .util li:not(.u-1){display:none}
  .util .u-long{display:none}.util .u-short{display:inline}
  .sis .s-long{display:none}
}
@media (min-width:760px){.sis .s-short{display:none}}

/* ===== header ===== */
.hdr{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:28px;min-height:72px}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);flex:none}
.logo svg{width:32px;height:32px}
.logo-t{display:flex;flex-direction:column;line-height:1}
.logo-w{font:700 24px/1 var(--fh);letter-spacing:-.01em}
.logo-w b{font-weight:700;color:var(--accent-tx)}
.logo-s{font:500 12.5px/1 var(--fb);color:var(--ink-3);margin-top:5px}
.nav{display:flex;align-items:center;gap:2px;min-width:0}
.nav a{display:inline-flex;align-items:center;height:40px;padding:0 12px;border-radius:3px;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink-2);white-space:nowrap;transition:color var(--t),background-color var(--t)}
.nav a:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.hdr-r{display:flex;align-items:center;gap:12px;margin-left:auto;flex:none}
.seg{display:flex;border:1px solid var(--line-2);border-radius:var(--r);padding:2px;gap:2px}
.seg button{min-width:40px;height:36px;border:0;border-radius:2px;background:transparent;font:600 13.5px/1 var(--fb);letter-spacing:.04em;color:var(--ink-2)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lsel{display:none;height:36px;padding:0 6px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--bg);color:var(--ink);font:600 13px/1 var(--fb);letter-spacing:.06em;cursor:pointer}
.listbtn{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px 0 10px;border:1px solid var(--line-2);border-radius:var(--r);background:transparent;color:var(--ink);transition:border-color var(--t)}
.listbtn:hover{border-color:var(--ink)}
.listbtn .bagw{position:relative;display:grid}
.listbtn .ui{width:22px;height:22px}
.badge{position:absolute;top:-7px;right:-9px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--sig);color:var(--on-sig);font:700 11px/18px var(--fb);text-align:center;font-variant-numeric:tabular-nums}
.badge.zero{display:none}
.listbtn .ct{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.listbtn .ct-l{font-size:12px;color:var(--ink-3)}
.listbtn .ct-v{font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.listbtn.bump .badge{animation:bump 420ms var(--ease)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.hdr-cta{min-height:46px}
@media (max-width:1199px){.hdr-in{gap:18px}.hdr-cta{display:none}}
@media (max-width:1099px){.logo-s{display:none}}
@media (max-width:899px){.nav{display:none}}
/* five language buttons: a little tighter while the nav shares the bar with them */
@media (min-width:760px) and (max-width:1099px){.seg button{min-width:32px;padding:0 4px;font-size:12.5px;letter-spacing:.04em}.hdr-in{gap:14px}.hdr-r{gap:10px}}
@media (max-width:759px){
  .hdr-in{min-height:58px;gap:8px}
  .logo svg{width:26px;height:26px}.logo{gap:8px}
  .logo-w{font-size:21px}
  .hdr-r{gap:8px}
  .seg{display:none}
  .lsel{display:block}
  .listbtn{padding:0 10px;height:42px;border-color:transparent}
  .listbtn .ct{display:none}
}

/* ===== hero: the pond plan T-1 is the picture; the copy sits on the open sheet to its left ===== */
.hero{border-bottom:1px solid var(--line)}
.hero-top{position:relative;overflow:hidden;isolation:isolate}
.hmap{position:absolute;top:0;bottom:0;right:0;left:38%;z-index:-1;pointer-events:none;color:var(--map)}
.hmap svg{width:100%;height:100%;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30%);mask-image:linear-gradient(90deg,transparent 0,#000 30%)}
.hmap .df{fill:var(--depth);fill-opacity:var(--depth-o);stroke:none}
.hmap .c{fill:none;stroke:currentColor;stroke-width:1px;vector-effect:non-scaling-stroke}
.hmap .cr{opacity:var(--map-o)}
.hmap .ci{opacity:var(--map-oi)}
.hmap .c0{opacity:var(--map-o0);stroke-width:1.5px}
.hmap text{font:500 12.5px/1 var(--fb);fill:var(--ink-2);stroke:var(--bg);stroke-width:5px;paint-order:stroke;stroke-linejoin:round;font-variant-numeric:tabular-nums}
.hmap .pn text{font:600 16px/1 var(--fh);fill:var(--ink)}
.hmap .pn text.ha{font:500 13px/1 var(--fb);fill:var(--ink-2)}
.hmap .cut{color:var(--accent-tx)}
.hmap .cut path{fill:none;stroke:currentColor;stroke-width:1.5px;vector-effect:non-scaling-stroke}
.hmap .cut .cl{stroke-dasharray:16 4 2 4;opacity:.9}
.hmap .cut .cb{stroke-width:3px}
.hmap .cut .ah{fill:currentColor;stroke:none}
.hmap .cut text{font:700 16px/1 var(--fh);fill:currentColor}
.hmap .st path,.hmap .st rect{fill:none;stroke:var(--ink-2);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.hmap .st .o{fill:var(--bg)}
.hmap .st .dsh{stroke-dasharray:4 3}
/* drawing title block, as in the corner of a survey sheet */
.anno{position:absolute;top:24px;right:var(--gut);display:grid;gap:3px;min-width:168px;padding:10px 12px 11px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--bg);font:500 12.5px/1.25 var(--fb);color:var(--ink-3);font-variant-numeric:tabular-nums}
.anno .a-k{font:600 14px/1.2 var(--fh);color:var(--ink)}
.anno .a-scale{display:flex;margin-top:6px;font-weight:500}
.anno .a-scale span{width:34px;padding-top:5px;border-top:2px solid var(--depth);text-align:left;position:relative}
.anno .a-scale span:nth-child(even){border-top-color:color-mix(in srgb,var(--depth) 35%,transparent)}
.anno .a-scale span::before{content:"";position:absolute;left:0;top:-5px;height:7px;border-left:1px solid var(--ink-3)}
.hero-in{position:relative;padding-top:clamp(44px,6.4vw,96px);padding-bottom:clamp(44px,5.4vw,80px)}
.hero-copy{max-width:600px}
.hero h1{font:600 clamp(42px,4.9vw,68px)/1.05 var(--fh);letter-spacing:-.018em;color:var(--ink)}
.hero h1 .hl{display:block;overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em}
.hero h1 .hl>span{display:inline-block}
.lead{margin-top:22px;max-width:520px;font-size:clamp(17px,1.35vw,19px);line-height:1.55;color:var(--ink-2)}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}

/* the process in three steps (replaces the old figure row) */
.flow-w{border-top:1px solid var(--line);background:var(--bg-2)}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.flow li{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 16px;align-items:start;padding:24px 28px 26px 0}
.flow li+li{padding-left:28px;border-left:1px solid var(--line)}
.fl-n{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--sig);color:var(--on-sig);font:700 18px/1 var(--fh)}
.fl-t h3{padding-top:7px;font:600 19px/1.25 var(--fh);letter-spacing:-.005em;color:var(--ink)}
.fl-t p{margin-top:6px;max-width:38ch;font-size:14.5px;line-height:1.5;color:var(--ink-2)}

/* cross-section band */
.xsec{border-top:1px solid var(--line);background:var(--bg)}
.xs-in{display:grid;grid-template-columns:minmax(240px,290px) minmax(0,1fr);gap:40px;padding-top:30px;padding-bottom:32px;align-items:start}
.xs-h h2{font:600 24px/1.15 var(--fh);letter-spacing:-.005em}
.xs-h p{margin-top:6px;font-size:14px;line-height:1.45;color:var(--ink-2)}
.xs-lg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px;margin-top:16px;border-top:1px solid var(--line)}
.xs-lg a{display:flex;align-items:center;gap:10px;min-height:42px;padding:6px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:14.5px;line-height:1.2;color:var(--ink)}
.xs-lg a:hover span,.xs-lg a:focus-visible span{text-decoration:underline;text-underline-offset:3px}
.xs-lg b{flex:none;display:grid;place-items:center;width:24px;height:24px;border:1.5px solid var(--accent-tx);border-radius:50%;font:700 12px/1 var(--fb);color:var(--accent-tx);font-variant-numeric:tabular-nums;transition:background-color var(--t),color var(--t),border-color var(--t)}
.xs-lg a:hover b,.xs-lg a:focus-visible b{background:var(--sig);border-color:var(--sig);color:var(--on-sig)}
.xs-fig{min-width:0}
.xs-fig svg{display:block;width:100%;height:auto;overflow:visible}
.xs .ea{fill:var(--earth)}
.xs .wa{fill:var(--depth);fill-opacity:calc(var(--depth-o) * 1.7)}
.xs .pf{fill:none;stroke:var(--ink);stroke-width:1.75;stroke-linejoin:round}
.xs .ht{fill:none;stroke:var(--ink-3);stroke-width:1;opacity:.5}
.xs .wln{fill:none;stroke:var(--water-ln);stroke-width:1.5}
.xs .wsym{fill:none;stroke:var(--water-ln);stroke-width:1.5}
.xs .eq{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.xs .eq .o{fill:var(--bg)}
.xs .eq .f{fill:var(--ink);stroke:none}
.xs .ax{fill:none;stroke:var(--ink-3);stroke-width:1}
.xs .dsh{stroke-dasharray:3 3}
.xs .bub{fill:none;stroke:var(--water-ln);stroke-width:1}
.xs .tx{font:500 12px/1 var(--fb);fill:var(--ink-2);font-variant-numeric:tabular-nums}
.xs .ld{fill:none;stroke:var(--accent-tx);stroke-width:1}
.xs .mk circle{fill:var(--bg);stroke:var(--accent-tx);stroke-width:1.5;transition:fill var(--t),stroke var(--t)}
.xs .mk text{font:700 11.5px/1 var(--fb);fill:var(--accent-tx);text-anchor:middle;transition:fill var(--t)}
.xs .mk.on circle{fill:var(--sig);stroke:var(--sig)}
.xs .mk.on text{fill:var(--on-sig)}

@media (max-width:1099px){.xs-in{grid-template-columns:1fr;gap:18px}.xs-lg{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px) and (max-width:1199px){
  .hmap{left:calc(var(--gut) + 500px)}
  .hmap svg{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18%);mask-image:linear-gradient(90deg,transparent 0,#000 18%)}
}
@media (max-width:1023px){
  .flow{grid-template-columns:minmax(0,1fr)}
  .flow li,.flow li+li{padding:18px 0;border-left:0}
  .flow li+li{border-top:1px solid var(--line)}
}
@media (min-width:760px) and (max-width:899px){
  .hero-top{display:flex;flex-direction:column}
  .hmap{position:relative;inset:auto;order:2;height:40vw;z-index:0;border-top:1px solid var(--line)}
  .hmap svg{-webkit-mask-image:none;mask-image:none}
  .hero-in{order:1}
}
@media (max-width:899px){.anno{display:none}}
@media (max-width:759px){
  .hero-top{display:flex;flex-direction:column}
  .hmap{position:relative;inset:auto;order:2;height:56vw;z-index:0;border-top:1px solid var(--line)}
  .hmap svg{-webkit-mask-image:none;mask-image:none}
  .hmap text{font-size:22px;stroke-width:9px}
  .hmap .pn text{font-size:24px}.hmap .pn text.ha{font-size:21px}
  .hmap .cut text{font-size:24px}
  .hero-in{order:1;padding-top:30px;padding-bottom:30px}
  .hero h1{font-size:clamp(34px,9.6vw,46px);line-height:1.08}
  .hero h1 .hl{display:inline}
  .lead{margin-top:16px}
  .ctas{margin-top:24px}
  .ctas .btn{flex:1 1 auto}
  .fl-n{width:34px;height:34px;font-size:16px}
  .fl-t h3{padding-top:5px;font-size:17.5px}
  .xs-in{padding-top:22px;padding-bottom:24px}
  .xs-lg{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
  .xs-lg a{font-size:14px}
}

/* ===== sections ===== */
.sec{padding:clamp(52px,6.4vw,96px) 0 0}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 32px;flex-wrap:wrap;margin-bottom:28px}
.sec-h h2{font:600 clamp(30px,3.2vw,44px)/1.1 var(--fh);letter-spacing:-.015em}
.sec-h p{color:var(--ink-2);font-size:15.5px;max-width:520px}
.sec-h .lab{display:block;margin-bottom:10px}

/* ===== catalogue ===== */
.catalog{padding-bottom:clamp(40px,4.4vw,64px)}
.layout{display:grid;grid-template-columns:236px minmax(0,1fr);gap:44px;align-items:start}
.side{position:sticky;top:calc(var(--hdr-h,72px) + 24px);padding:4px 0 10px}
.side .lab{padding:0 0 12px}
.facet{display:flex;align-items:baseline;justify-content:space-between;gap:12px;width:100%;padding:8px 0 8px 14px;border-left:2px solid var(--line);text-decoration:none;font-size:15px;line-height:1.3;color:var(--ink-2);transition:color var(--t),border-color var(--t)}
.facet b{font-weight:500;font-size:12.5px;color:var(--ink-3);margin-right:8px;font-variant-numeric:tabular-nums}
.facet:hover{color:var(--ink);border-left-color:var(--ink-3)}
.facet .n{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.facet[aria-current="true"]{color:var(--ink);font-weight:600;border-left-color:var(--accent)}
.side-sum{margin-top:28px;padding:16px 16px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg-2)}
.side-sum .lab{padding:0 0 8px;display:block}
.side-sum .sv{font:600 22px/1.15 var(--fh);font-variant-numeric:tabular-nums}
.side-sum .su{margin-top:2px;font-size:13px;color:var(--ink-3)}
.side-sum .btn{width:100%;margin-top:14px;min-height:42px;font-size:14.5px}
.side-sum .btn+.btn{margin-top:8px}
.side-hint{margin-top:14px;font-size:13px;line-height:1.45;color:var(--ink-3)}
.chipbar{display:none}
.cblock{scroll-margin-top:calc(var(--hdr-h,72px) + 20px)}
.cblock+.cblock{margin-top:48px;padding-top:40px;border-top:1px solid var(--line)}
.ch{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:22px;flex-wrap:wrap}
/* catalogue code of the group (quoted in requests): small and quiet */
.ccode{margin-bottom:6px;font-size:13.5px;line-height:1.3;color:var(--ink-3)}
.ccode b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.ch h3{font:600 clamp(24px,2.2vw,30px)/1.15 var(--fh);letter-spacing:-.01em}
.ch p{margin-top:8px;color:var(--ink-2);font-size:15px;max-width:560px}
.in-list{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--ink);border-radius:var(--r-s);background:transparent;color:var(--ink);font-size:14px;font-weight:600}
.in-list .ui{width:17px;height:17px}
.in-list b{min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--sig);color:var(--on-sig);font:700 11.5px/20px var(--fb);text-align:center}

.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 24px}
.card{position:relative;display:flex;flex-direction:column;min-width:0}
.tile{position:relative;display:grid;place-items:center;aspect-ratio:4/3;border:1px solid var(--tile-line);border-radius:var(--r);background:var(--tile);overflow:hidden;transition:border-color var(--t)}
.card:hover .tile{border-color:var(--line-2)}
.tile .dw{width:80%;height:auto}
.code{position:absolute;top:10px;left:12px;font:500 12px/1 var(--fb);color:var(--ink-3);font-variant-numeric:tabular-nums}
.tick{position:absolute;top:8px;right:8px;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px 0 5px;border-radius:var(--r-s);background:var(--ink);color:var(--bg);font:600 11.5px/1 var(--fb);font-variant-numeric:tabular-nums}
.tick .ui{width:14px;height:14px;stroke-width:2}
.cbody{display:flex;flex-direction:column;flex:1;padding-top:14px;min-width:0}
.cname{font:600 17px/1.25 var(--fb);letter-spacing:-.003em}
.cdesc{margin-top:6px;font-size:14.5px;line-height:1.45;color:var(--ink-2)}
.cfoot{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:10px}
.pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pr .pl{font-size:12.5px;color:var(--ink-3)}
.price{font:600 17px/1.2 var(--fb)}
.add{width:100%;min-height:44px;padding:0 12px}
.step{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;height:44px;border:1px solid var(--ink);border-radius:3px}
.step button{height:100%;display:grid;place-items:center;border:0;background:transparent;color:var(--ink);transition:background-color var(--t)}
.step button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.step button .ui{width:18px;height:18px}
.step output{text-align:center;font:600 15.5px/1 var(--fb);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:899px){

  .chips{display:flex;gap:6px;overflow-x:auto;padding:10px var(--gut);margin:0 calc(-1 * var(--gut));scrollbar-width:none;overscroll-behavior-x:contain}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r-s);text-decoration:none;font-size:14px;white-space:nowrap;color:var(--ink-2)}
  .chip b{font-weight:600;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .chip[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}

}

  .card:first-child{border-top:0}
  .tile{aspect-ratio:1/1;align-self:start}
  .tile .dw{width:92%}
  .code{top:6px;left:7px;font-size:10px}
  .tick{top:5px;right:5px;height:18px;padding:0 5px 0 3px;font-size:10.5px}
  .tick .ui{width:11px;height:11px}
  .cbody{padding-top:0}
  .cname{font-size:16px}
  .cdesc{font-size:13.5px;margin-top:4px}

}

/* ===== quote ===== */
.quote{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:56px;align-items:start;padding-bottom:clamp(56px,6vw,96px)}
.q-side{position:sticky;top:calc(var(--hdr-h,72px) + 24px)}
.q-side .lab{display:block;margin-bottom:10px}
.q-side h2{font:600 clamp(30px,3.2vw,44px)/1.1 var(--fh);letter-spacing:-.015em}
.q-side .ql-lead{margin-top:14px;color:var(--ink-2);font-size:16px;max-width:440px}
.qc{margin-top:28px;border-top:1px solid var(--line)}
.qc h3{font:600 14px/1.2 var(--fb);color:var(--ink-3);padding:16px 0 6px}
.cc{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-bottom:1px solid var(--line)}
.cc a,.cc span.cv{display:flex;align-items:center;gap:12px;font-weight:600;font-size:16px;text-decoration:none;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.cc span.cv{font-weight:400;color:var(--ink-2);font-size:15px}
.cc a:hover{text-decoration:underline;text-underline-offset:3px}
.cc .ui{width:18px;height:18px;color:var(--ink-3)}
.cc-copy{flex:none;width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:3px;background:transparent;color:var(--ink);transition:border-color var(--t)}
.cc-copy:hover{border-color:var(--ink)}
.cc-copy .ui{width:17px;height:17px;color:currentColor}
.cc-copy .i-ok{display:none}
.cc-copy.ok .i-cp{display:none}.cc-copy.ok .i-ok{display:block;color:var(--accent-tx)}
.qform{border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);min-width:0}
.qf-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--line);font:600 14px/1.3 var(--fb);color:var(--ink-2)}
.qf-head b{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;color:var(--ink)}
.qf-head b .ui{width:16px;height:16px;color:var(--ink-3)}
.qf-body{padding:4px 24px 24px}
.qf-grp{padding:22px 0;border-bottom:1px solid var(--line)}
.qf-grp>legend{float:left;width:100%;display:flex;align-items:center;gap:10px;margin-bottom:16px;font:600 20px/1.2 var(--fh);letter-spacing:-.005em}
.qf-grp>legend+*{clear:both}
.gn{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font:600 13px/1 var(--fb);font-variant-numeric:tabular-nums}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.fld label,.sub legend{display:block;font-weight:600;font-size:14.5px;line-height:1.3;margin-bottom:7px}
.num{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;height:46px;border:1px solid var(--field);border-radius:3px;background:var(--surface);transition:border-color var(--t),box-shadow var(--t)}
.num:focus-within{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.num.bad{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
.num input{min-width:0;border:0;background:transparent;text-align:center;font:600 17px/1 var(--fb);font-variant-numeric:tabular-nums;outline:none}
.num input::placeholder{color:var(--ink-3);opacity:1;font-weight:400}
.nb{display:grid;place-items:center;border:0;background:transparent;color:var(--ink);transition:background-color var(--t)}
.nb:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.nb .ui{width:18px;height:18px}
.nb:first-child{border-radius:2px 0 0 2px}.nb:last-child{border-radius:0 2px 2px 0}
.err{display:flex;gap:6px;align-items:flex-start;margin-top:7px;font-size:13.5px;line-height:1.35;color:var(--err)}
.err .ui{width:16px;height:16px;margin-top:1px}
.vol{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-2);border-radius:3px}
.vol-l{display:flex;flex-direction:column;font-weight:600;font-size:14.5px}
.vol small{font-weight:400;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.vol-r{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.vol output{font:600 24px/1.1 var(--fh);font-variant-numeric:tabular-nums;white-space:nowrap}
.fp{display:grid;gap:18px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:inline-flex}
.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.opt span{display:inline-flex;align-items:center;min-height:40px;padding:8px 14px;border:1px solid var(--line-2);border-radius:3px;font-size:14.5px;line-height:1.25;transition:border-color var(--t),background-color var(--t),color var(--t)}
.opt:hover span{border-color:var(--ink)}
.opt input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.opt input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
/* "Nežinau – parinkite" chosen: a quiet outlined state, so a real choice (solid ink) stands out from "don't know" */
.opt.unk input:checked+span{background:var(--bg-2);border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink);font-weight:400}
.ql{margin-bottom:16px}
.ql-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.ql-k{font-weight:600;font-size:14.5px}
.ql-h .lnk{font-size:14px}
.q-list{display:flex;flex-wrap:wrap;gap:6px}
.q-chip{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:5px 9px;border:1px solid var(--line-2);border-radius:var(--r-s);font-size:14px;line-height:1.25;background:var(--bg-2)}
.q-chip span{min-width:0;overflow-wrap:anywhere}
.q-chip b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.q-empty{font-size:14px;color:var(--ink-3);padding:10px 12px;border:1px dashed var(--line-2);border-radius:3px}
textarea{display:block;width:100%;min-height:104px;padding:10px 12px;border:1px solid var(--field);border-radius:3px;background:var(--surface);font-size:16px;line-height:1.45;resize:vertical;transition:border-color var(--t),box-shadow var(--t)}
textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
textarea::placeholder{color:var(--ink-3);opacity:1}
.qf-sub{padding-top:22px}
.qf-sub .btn{width:100%;min-height:50px}
.qf-note{margin-top:10px;font-size:13px;line-height:1.45;color:var(--ink-3)}
.out-box{margin-top:24px;padding-top:18px;border-top:1px solid var(--ink)}
.out-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;font:600 20px/1.2 var(--fh)}
.state{font:600 13px/1.3 var(--fb);padding:3px 8px;border:1px solid var(--line-2);border-radius:var(--r-s);color:var(--ink-2)}
.state.ready{border-color:var(--accent-tx);color:var(--accent-tx)}
#out{white-space:pre-wrap;overflow-wrap:anywhere;font:400 14.5px/1.55 var(--fb);background:var(--bg-2);padding:14px 16px;border:1px solid var(--line);border-radius:3px;max-height:360px;overflow:auto}
#out:focus-visible{outline-offset:1px}
.out-note{margin-top:8px;font-size:13px;color:var(--ink-3)}
.out-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px}
.copy-status{font-size:14px;font-weight:600;color:var(--accent-tx)}
/* phones: the e-mail button on its own row, copy and print share the next one (the same in every language) */
@media (max-width:559px){
  .out-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .out-actions #mail,.out-actions .copy-status{grid-column:1/-1}
  .out-actions .copy-status:empty{display:none}
  .out-actions .btn{min-width:0;padding:0 12px;white-space:normal;text-align:center}
}
@media (max-width:1099px){.quote{gap:40px}}
@media (max-width:899px){.quote{grid-template-columns:minmax(0,1fr)}.q-side{position:static}}
@media (max-width:759px){
  .qf-head{padding:12px var(--gut)}
  .qf-body{padding:0 var(--gut) 20px}
  .qform{margin:0 calc(-1 * var(--gut));border-radius:0;border-left:0;border-right:0}
  .g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
  .fld label{font-size:13.5px}
  .num{grid-template-columns:38px minmax(0,1fr) 38px}
  .vol output{font-size:23px}
  .out-actions .btn{flex:1 1 auto}

@media (max-width:379px){.g2{grid-template-columns:minmax(0,1fr)}}

/* ===== trust ===== */
.trust{border-top:1px solid var(--line)}
.trust ul{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.trust li{padding:32px 28px 36px 0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-content:start}
.trust li+li{padding-left:28px;border-left:1px solid var(--line)}

@media (max-width:1099px){.trust ul{grid-template-columns:repeat(2,minmax(0,1fr))}.trust li:nth-child(3){padding-left:0;border-left:0}.trust li:nth-child(n+3){border-top:1px solid var(--line)}}

/* ===== footer ===== */
.foot{position:relative;overflow:hidden;background:var(--foot);color:var(--foot-ink);isolation:isolate}
.foot .fmap{position:absolute;inset:0;z-index:-1;color:var(--foot-ink);opacity:.085;pointer-events:none}

.foot .fmap path{fill:none;stroke:currentColor;stroke-width:1px;vector-effect:non-scaling-stroke}
.f-top{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.25fr;gap:40px;padding:64px 0 48px}
.foot .logo{color:var(--foot-ink)}
.foot .logo-s{color:var(--foot-ink-2)}
.foot .logo-w b{color:#8CC3EA}
.foot .logo svg{--accent:#8CC3EA}
.f-about{margin-top:18px;font-size:14.5px;line-height:1.55;color:var(--foot-ink-2);max-width:340px}

.foot h2{font:600 16px/1.2 var(--fh);color:var(--foot-ink);margin-bottom:14px}
.foot ul{display:grid;gap:9px;font-size:15px}
.foot a,.foot .fl{color:var(--foot-ink);text-decoration:none;background:none;border:0;padding:0;font:inherit;text-align:left}
.foot a:hover,.foot .fl:hover{text-decoration:underline;text-underline-offset:3px}
.foot .ui{width:16px;height:16px}
.f-c li{display:flex;gap:10px;align-items:flex-start}
.f-c li .ui{margin-top:3px;color:var(--foot-ink-2)}
.f-bot{display:flex;justify-content:space-between;gap:12px 32px;flex-wrap:wrap;padding:20px 0 28px;border-top:1px solid var(--foot-line);font-size:13px;color:var(--foot-ink-2)}
.foot :focus-visible{outline-color:var(--foot-ink)}
@media (max-width:1099px){.f-top{grid-template-columns:1fr 1fr}}
@media (max-width:599px){.f-top{grid-template-columns:1fr;gap:32px;padding:48px 0 36px}}

/* ===== drawer (dialog) ===== */
dialog{padding:0;border:0;color:var(--ink);background:var(--surface);max-width:none;max-height:none}
dialog::backdrop{background:var(--scrim)}
@keyframes sheet-in{from{opacity:0;transform:translateX(18px)}}
@keyframes up-in{from{opacity:0;transform:translateY(12px)}}
@keyframes fade-in{from{opacity:0}}
dialog[open]::backdrop{animation:fade-in 180ms var(--ease)}
.x{position:absolute;top:12px;right:12px;z-index:3;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:var(--r);background:var(--surface);color:var(--ink)}
.x:hover{background:var(--bg-2)}
#drawer{position:fixed;inset:0 0 0 auto;margin:0;width:min(460px,100vw);height:100%;max-height:100%;border-left:1px solid var(--line);box-shadow:-24px 0 60px -30px rgba(0,0,0,.35)}
#drawer[open]{animation:sheet-in 180ms var(--ease)}
.dlg-in{position:relative;height:100%;display:flex;flex-direction:column;min-height:0}
.d-head{padding:22px 64px 16px 24px;border-bottom:1px solid var(--line)}
.d-head .lab{display:block;margin-bottom:8px}

.d-sub{margin-top:6px;font-size:14px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.d-list{flex:1;overflow:auto;overscroll-behavior:contain;padding:0 24px;min-height:0}
.drow{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.dthumb{display:grid;place-items:center;aspect-ratio:4/3;border:1px solid var(--tile-line);border-radius:3px;background:var(--tile)}

.db small{display:block;font:500 12.5px/1.2 var(--fb);color:var(--ink-3)}

.drow-a{display:flex;align-items:center;gap:16px;margin-top:10px}
.drow-a .step{height:38px;grid-template-columns:38px 64px 38px}
.drow-a .step output{font-size:14.5px}
.rm{background:none;border:0;padding:6px 0;font-size:13.5px;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.rm:hover{color:var(--ink);text-decoration-color:currentColor}
.d-empty{flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:10px;padding:32px 24px 48px}
.d-empty .eg{width:64px;height:64px;color:var(--ink-3);stroke-width:1.1;margin-bottom:6px}
.d-empty h3{font:600 24px/1.2 var(--fh)}

.d-foot{position:relative;padding:18px 24px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--ink);background:var(--surface)}
.d-total{display:flex;justify-content:space-between;align-items:baseline;gap:12px}

.d-total b{font:600 20px/1.1 var(--fh);font-variant-numeric:tabular-nums}
.d-price{margin-top:4px;font-size:13px;color:var(--ink-3)}
.d-actions{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;margin-top:16px}
/* a label that does not fit (German at the largest text size on 360 px) wraps inside its button */
.d-actions .btn{min-height:48px;min-width:0;white-space:normal;text-align:center}

@media (max-width:759px){
  #drawer{inset:auto 0 0 0;width:100vw;height:auto;max-height:90vh;border-left:0;border-top:1px solid var(--line);border-radius:8px 8px 0 0}

  #drawer .dlg-in{max-height:90vh}
  .d-head{padding:18px 60px 14px var(--gut)}
  .d-list,.d-foot{padding-left:var(--gut);padding-right:var(--gut)}
  .d-empty{padding:24px var(--gut) 32px}
  .drow{grid-template-columns:64px minmax(0,1fr);gap:12px}
}

/* ===== toasts ===== */
.toasts{position:fixed;right:var(--gut);bottom:calc(var(--gut) + env(safe-area-inset-bottom));z-index:60;display:grid;gap:8px;justify-items:end;pointer-events:none;max-width:calc(100vw - 2 * var(--gut))}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;min-width:0;max-width:440px;padding:12px 12px 12px 14px;border-radius:var(--r);background:var(--ink);color:var(--bg);box-shadow:0 12px 32px -14px rgba(0,0,0,.45);animation:up-in 180ms var(--ease);font-size:14px;line-height:1.3}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity 160ms,transform 160ms}
.toast .ui{width:18px;height:18px;flex:none}
.toast span{min-width:0;overflow-wrap:anywhere}
.toast button{flex:none;margin-left:auto;height:36px;padding:0 12px;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);border-radius:3px;background:transparent;color:var(--bg);font-weight:600;font-size:13.5px}
.toast button:hover{background:color-mix(in srgb,var(--bg) 12%,transparent)}
.toast :focus-visible{outline-color:var(--bg)}
@media (max-width:759px){.toasts{left:var(--gut);right:var(--gut);justify-items:stretch}.toast{max-width:none}}

/* ===== technical drawings ===== */
.dw{overflow:visible;fill:none;stroke:var(--d-ink);stroke-width:1.75px;stroke-linecap:round;stroke-linejoin:round}
.dw *{vector-effect:non-scaling-stroke}
.dw .a{stroke:var(--d-aux);stroke-width:1px}
.dw .m{opacity:.75}
.dw .c{stroke:var(--d-aux);stroke-width:1px;stroke-dasharray:12 3 2 3}
.dw .h{stroke-dasharray:3 2.5}
.dw .o{fill:var(--tile)}
.dw .ox{fill:var(--tile);stroke:none}
.dw .f{fill:var(--d-ink);stroke:none}
.dw .w{stroke:var(--water-ln);stroke-width:1.5px}
.dw text{font:600 9.5px/1 var(--fb);fill:var(--d-ink);stroke:none}

/* ===== request lines: parameters on the card, in the drawer, in the form ===== */
.it-x{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:6px}
.it-x .lnk{min-height:28px;font-size:13.5px;color:var(--ink-2)}
.it-x .lnk:hover{color:var(--ink)}
.vsum{width:100%;min-height:44px;padding:0 12px;font-size:14.5px;font-variant-numeric:tabular-nums}
.dpar{margin-top:4px;font-size:13.5px;line-height:1.4;color:var(--ink-2);overflow-wrap:anywhere}
.dpar-b{display:inline-flex;align-items:center;min-height:32px;margin-top:2px;font-size:13.5px;color:var(--ink-2)}
.dpar-b:hover{color:var(--ink)}
.dpar-b+.drow-a{margin-top:4px}
.q-chip small{display:block;margin-top:1px;font-size:12.5px;line-height:1.3;color:var(--ink-2)}
.d-nb{margin-top:2px;font-size:13px;line-height:1.4;color:var(--ink-2)}
.qf-nb{margin-top:12px;font-size:14px;line-height:1.4;font-weight:600;color:var(--ink-2)}
.qf-b2b{margin-top:4px;font-size:13.5px;line-height:1.4;color:var(--ink-2)}
.out-long{margin-top:12px;padding:10px 12px;border-left:2px solid var(--accent);background:var(--bg-2);font-size:13.5px;line-height:1.45;color:var(--ink-2)}

/* ===== parameter sheet, privacy note, Rekvizitai / Impressum (native dialogs, same pattern as the drawer) ===== */
#cfg,#priv,#imp{position:fixed;inset:0;margin:auto;width:min(600px,calc(100vw - 48px));height:fit-content;max-height:min(88vh,820px);border:1px solid var(--line-2);border-radius:6px;box-shadow:0 30px 70px -30px rgba(0,0,0,.45);overflow:hidden}
#priv,#imp{width:min(560px,calc(100vw - 48px))}
#cfg[open],#priv[open],#imp[open]{display:flex;flex-direction:column;animation:up-in 180ms var(--ease)}
#cfg .dlg-in,#priv .dlg-in,#imp .dlg-in{flex:1 1 auto;height:auto;max-height:min(88vh,820px)}
.c-head{display:grid;grid-template-columns:88px minmax(0,1fr);gap:16px;align-items:center;padding:20px 64px 16px 24px;border-bottom:1px solid var(--line)}
.c-head .lab{display:block;margin-bottom:6px}
.c-head h2{font:600 24px/1.15 var(--fh);letter-spacing:-.01em;overflow-wrap:anywhere;hyphens:auto}
.c-body{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 24px 22px}
.c-sub{padding:14px 0 2px;font-size:14px;line-height:1.45;color:var(--ink-2)}
.c-g{padding-top:16px}
.c-g>legend{float:left;width:100%;margin-bottom:8px}
.c-g>legend+*{clear:both}
.c-g>legend,.c-g>label{display:block;font-weight:600;font-size:14.5px;line-height:1.3}
.c-g>label{margin-bottom:8px}
.c-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.pin{display:flex;align-items:center;height:46px;border:1px solid var(--field);border-radius:3px;background:var(--surface);transition:border-color var(--t),box-shadow var(--t)}
.pin:focus-within{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.pin.bad{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
.pin input{flex:1 1 auto;min-width:0;height:100%;padding:0 12px;border:0;background:transparent;font:400 16px/1.2 var(--fb);outline:none}
.pin input::placeholder{color:var(--ink-3);opacity:1}
.pin .pu{flex:none;padding:0 12px 0 2px;font-size:14.5px;color:var(--ink-3);white-space:nowrap}
.c-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:14px 24px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--ink);background:var(--surface)}
.c-q{display:flex;align-items:center;gap:12px}
.c-ql{font-weight:600;font-size:14.5px}
.c-q .step{height:44px;grid-template-columns:44px 76px 44px}
.c-act{display:flex;flex-wrap:wrap;gap:10px;margin-left:auto}
.c-act .btn{min-height:46px}
.pv-b{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding:4px 24px 22px}
.pv-l{display:grid;gap:12px;padding-top:16px}
.pv-l li{position:relative;padding-left:18px;font-size:15px;line-height:1.5;color:var(--ink-2)}
.pv-l li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;background:var(--accent)}
.pv-l a{color:var(--ink);font-weight:600}
.pv-clr{margin-top:20px;white-space:normal;text-align:center}
.pv-st{margin-top:10px;font-size:14px;font-weight:600;color:var(--accent-tx)}
.pv-st:empty{display:none}
.pv-f{display:flex;justify-content:flex-end;padding:14px 24px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.pv-f .btn{min-width:120px}
.imp-dl{padding-top:8px}
.imp-dl div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:2px 16px;padding:11px 0;border-bottom:1px solid var(--line)}
.imp-dl dt{font-size:14px;line-height:1.45;color:var(--ink-3)}
.imp-dl dd{font-size:15px;line-height:1.45;color:var(--ink);overflow-wrap:anywhere}
.imp-dl a{color:var(--ink);font-weight:600}
.imp-b2b{margin-top:18px;padding:10px 12px;border-left:2px solid var(--accent);background:var(--bg-2);font-size:14px;line-height:1.45;color:var(--ink-2)}
/* the sheet / calculator footer when the list already holds 60 lines */
.c-full{flex:1 1 100%;margin:0;padding:10px 12px;border-left:2px solid var(--err);background:var(--bg-2);font-size:13.5px;line-height:1.45;color:var(--ink)}
@media (max-width:759px){
  #cfg,#priv,#imp{inset:auto 0 0 0;width:100vw;max-width:100vw;max-height:92vh;border-width:1px 0 0;border-radius:8px 8px 0 0}
  #cfg .dlg-in,#priv .dlg-in,#imp .dlg-in{max-height:92vh}
  .c-head{grid-template-columns:64px minmax(0,1fr);gap:12px;padding:16px 60px 12px var(--gut)}
  .c-head h2{font-size:23px}
  .c-body,.pv-b{padding-left:var(--gut);padding-right:var(--gut)}
  .c-foot{padding:12px var(--gut) calc(14px + env(safe-area-inset-bottom))}
  .c-q{width:100%;justify-content:space-between}
  /* "Atšaukti" and the main button stay side by side (at the largest text size their labels wrap inside) */
  .c-act{width:100%;margin-left:0;flex-wrap:nowrap}
  .c-act .btn{flex:1 1 auto;min-width:0;padding:0 12px;white-space:normal;text-align:center}
  .c-act .btn-p{flex-grow:3}
  .pv-f{padding-left:var(--gut);padding-right:var(--gut)}
  .pv-f .btn{flex:1 1 auto}
}
@media (max-width:379px){.c-row{grid-template-columns:minmax(0,1fr)}.imp-dl div{grid-template-columns:minmax(0,1fr)}}

/* ===== pass B: request type, farm profile, ponds, spare parts, draft (quote form) ===== */
.qf-mode{padding:20px 0 2px}
.qf-mode>legend{float:left;width:100%;margin-bottom:9px;font-weight:600;font-size:14.5px;line-height:1.3}
.qf-mode>legend+*{clear:both}
.mseg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;padding:2px;border:1px solid var(--line-2);border-radius:var(--r)}
.mseg label{position:relative;display:flex;min-width:0}
.mseg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.mseg span{flex:1;display:flex;align-items:center;justify-content:center;min-height:44px;padding:6px 10px;border-radius:2px;text-align:center;font-weight:600;font-size:15px;line-height:1.2;color:var(--ink-2);transition:background-color var(--t),color var(--t)}
.mseg label:hover span{color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.mseg input:checked+span{background:var(--ink);color:var(--bg)}
.mseg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.qf-req{margin:-4px 0 16px;font-size:13px;line-height:1.4;color:var(--ink-3)}
.qf-lead{margin:-4px 0 16px;font-size:14.5px;line-height:1.45;color:var(--ink-2)}
.ff{display:grid;gap:18px}
.ff .sub legend{margin-bottom:9px}
.fhint{margin-top:7px;font-size:13px;line-height:1.45;color:var(--ink-3)}
.qf-hint{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:13.5px;line-height:1.45;color:var(--ink-2)}
.qf-hint .ui{width:17px;height:17px;margin-top:1px;color:var(--ink-3)}
textarea.bad{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
.ponds{display:grid}
.pond{padding:14px 0 16px;border-top:1px solid var(--line)}
.pond:first-child{padding-top:0;border-top:0}
.pond-h{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px;margin-bottom:8px}
.pond-n{font:600 18px/1.1 var(--fh);font-variant-numeric:tabular-nums}
.pond-rm{min-height:30px;font-size:14px}
.pond-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.sel{position:relative;display:flex;height:46px;border:1px solid var(--field);border-radius:3px;background:var(--surface);transition:border-color var(--t),box-shadow var(--t)}
.sel:focus-within{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.sel select{appearance:none;-webkit-appearance:none;flex:1 1 auto;min-width:0;height:100%;padding:0 38px 0 12px;border:0;border-radius:3px;background:transparent;font:400 16px/1.2 var(--fb);color:var(--ink);outline:none;cursor:pointer;text-overflow:ellipsis}
.sel select option{background:var(--surface);color:var(--ink)}
.sel .ui{position:absolute;right:12px;top:13px;width:18px;height:18px;pointer-events:none;color:var(--ink-2)}
.pond-add{margin-top:6px;min-height:42px;font-size:14.5px}
.pond-max{margin-top:10px;font-size:13px;line-height:1.4;color:var(--ink-3)}
#gPonds .vol{margin-top:18px}
#gPonds .sub{margin-top:18px}
.ck{display:flex;align-items:flex-start;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);cursor:pointer}
.ck input{appearance:none;-webkit-appearance:none;flex:none;display:grid;place-items:center;width:22px;height:22px;margin:1px 0 0;border:1.5px solid var(--field);border-radius:3px;background:var(--surface);cursor:pointer;transition:background-color var(--t),border-color var(--t)}
.ck input::before{content:"";width:11px;height:6px;border-left:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:translateY(-1px) rotate(-45deg);opacity:0}
.ck input:checked{background:var(--ink);border-color:var(--ink)}
.ck input:checked::before{opacity:1}
.ck input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ck b{display:block;font-weight:600;font-size:14.5px;line-height:1.35}
.ck small{display:block;margin-top:2px;font-size:13px;line-height:1.4;color:var(--ink-3)}
.ck-st{margin-top:8px;font-size:13.5px;font-weight:600;color:var(--accent-tx)}
.ck-st:empty{display:none}
@media (max-width:759px){.pond-g{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.pond-f{grid-column:1/-1}}
@media (max-width:379px){.pond-g{grid-template-columns:minmax(0,1fr)}}
@media (forced-colors: active){
  .mseg input:checked+span{forced-color-adjust:none;background:Highlight;color:HighlightText}
  .ck input{forced-color-adjust:none;border-color:CanvasText;background:Canvas}
  .ck input:checked{background:Highlight;border-color:Highlight}
  .ck input::before{border-color:HighlightText}
}

/* ===== pass B: "Klausti apie šią įrangą" on the cards, net calculator, print buttons ===== */
.ask{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;min-height:36px;margin:-4px 0 -6px;font-size:14px;font-weight:600;line-height:1.3;color:var(--ink-2);text-decoration:underline;text-decoration-thickness:1px;text-decoration-color:var(--line-2);text-underline-offset:3px}
.ask .ui{width:17px;height:17px;color:var(--ink-3)}
.ask:hover{color:var(--ink);text-decoration-color:currentColor}
.ch-a{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.calc-b{min-height:36px;height:36px;padding:0 12px;border-radius:var(--r-s);font-size:14px}
.calc-b .ui{width:17px;height:17px}
.side-pr{display:inline-flex;align-items:center;gap:8px;min-height:32px;margin-top:10px;font-size:14px;color:var(--ink-2)}
.side-pr .ui{width:17px;height:17px}
.c-note{margin-top:10px;font-size:13px;line-height:1.45;color:var(--ink-3)}
.c-f .fhint{margin-top:6px}
.nres{margin-top:18px;padding:14px 16px 6px;border-left:2px solid var(--accent);background:var(--bg-2)}
.nres .lab{display:block;margin-bottom:8px}
.nres-m{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.nres-m output{font:600 40px/1 var(--fh);letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.nres-m span{font-size:14.5px;color:var(--ink-2)}
.nres-l{margin-top:12px;border-top:1px solid var(--line)}
.nres-l div{display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.35}
.nres-l div:last-child{border-bottom:0}
.nres-l dt{color:var(--ink-2)}
.nres-l dd{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;margin-left:auto}
.nres-e{padding-bottom:10px;font-size:14.5px;color:var(--ink-2)}
.nplan{display:block;width:100%;max-width:440px;height:auto;margin:16px auto 0;overflow:visible}
.nplan .nt{fill:none;stroke:var(--ink);stroke-width:1.25;vector-effect:non-scaling-stroke}
.nplan .pd{fill:var(--water);stroke:var(--d-aux);stroke-width:1;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.nplan .po{fill:var(--ink)}
.nplan .dm{fill:none;stroke:var(--ink-3);stroke-width:1;vector-effect:non-scaling-stroke}
.nplan text{font:600 11.5px/1 var(--fb);fill:var(--ink-2);font-variant-numeric:tabular-nums}
.nhow{margin-top:16px;padding-top:6px;border-top:1px solid var(--line)}
.nhow summary{padding:8px 0;cursor:pointer;font-weight:600;font-size:14.5px}
.nhow ul{display:grid;gap:6px;padding:0 0 4px 18px;list-style:disc;font-size:14px;line-height:1.45;color:var(--ink-2)}
#net{position:fixed;inset:0;margin:auto;width:min(600px,calc(100vw - 48px));height:fit-content;max-height:min(88vh,820px);border:1px solid var(--line-2);border-radius:6px;box-shadow:0 30px 70px -30px rgba(0,0,0,.45);overflow:hidden}
#net[open]{display:flex;flex-direction:column;animation:up-in 180ms var(--ease)}
#net .dlg-in{flex:1 1 auto;height:auto;max-height:min(88vh,820px)}
@media (max-width:759px){
  #net{inset:auto 0 0 0;width:100vw;max-width:100vw;max-height:92vh;border-width:1px 0 0;border-radius:8px 8px 0 0}
  #net .dlg-in{max-height:92vh}
  .nres-m output{font-size:34px}
}

/* ===== research-fix: catalogue rows stay aligned, full-size tap targets on phones ===== */
/* Three cards per row (760 px+): each card is a subgrid of five shared rows – drawing, name + description, price,
   actions, "Klausti apie šią įrangą" – so the price lines and buttons of a row share one line also when one card shows a
   stepper with its links and the next a single "Į sąrašą" button. With nothing on the list the layout is as before. */
@supports (grid-template-rows:subgrid){
  @media screen and (min-width:760px){
    .cgrid{row-gap:0}
    .card{display:grid;grid-template-rows:subgrid;grid-row:span 5}
    .card:nth-child(n+4){margin-top:32px}
    .cbody{display:grid;grid-template-rows:subgrid;grid-row:span 4}
    .cfoot{display:contents}
    .cfoot>.pr{margin-top:16px}
    .cfoot>.it-a{margin-top:10px;align-self:start}
    .cfoot>.ask{margin-top:6px;justify-self:start}
  }
}
/* phones and touch screens: text-link controls get a 44 px tall target (negative margins keep the visual spacing) */
@media (max-width:759px),(pointer:coarse){
  .it-x .lnk,.dpar-b,.rm,.ql-h .lnk{min-height:44px}
  .ask{min-height:44px;margin:-8px 0 -10px}
  .in-list,.calc-b{height:44px;min-height:44px}
  .pond-rm{min-height:44px;margin:-7px 0}
  .nhow summary{display:flex;align-items:center;min-height:44px;padding:0}
  .opt span{min-height:44px}
  .foot ul{gap:0}
  .foot ul a,.foot .fl{display:inline-flex;align-items:center;min-height:44px}
  .f-c li{align-items:center;min-height:44px}
  .f-c li .ui{margin-top:0}
  .drow-a .step{height:44px;grid-template-columns:44px 64px 44px}
  .pond-add{min-height:44px}
  .cc a{min-height:44px}
  .cc-copy{width:44px;height:44px}
}
@supports (grid-template-rows:subgrid){
  @media screen and (min-width:760px) and (pointer:coarse){.cfoot>.ask{margin-top:2px}}
}

/* ===== pass B: print. The request sheet (html.print-req, "Spausdinti") and the catalogue (any other print) ===== */
.ps,.p-only{display:none}
.ps-logo i{font-style:normal;font-weight:700}
@page{size:A4;margin:14mm 14mm 16mm}
@media print{
  body{background:#fff}
  body>*{zoom:1!important}
  body>:is(.toasts,#live,dialog){display:none!important}
  html.print-req body>:not(#printSheet):not(svg){display:none!important}
  html.print-req #printSheet{display:block}
  .ps,.pc-h{--ink:#000;--ink-2:#222;--ink-3:#444;color:#000;font:400 10pt/1.4 var(--fb)}
  /* the request number (BA-YYMMDD-HHMM-XXX) has the widest cell, so it stays on one line */
  .ps-tb{display:grid;grid-template-columns:1.55fr 1.1fr 1.5fr .85fr 1.3fr;border:1.2pt solid #000;break-inside:avoid}
  .ps-c{min-width:0;padding:2.2mm 3mm 2.4mm;border-left:.5pt solid #000}
  .ps-c:first-child{border-left:0}
  .ps-c small{display:block;font:600 7.5pt/1.2 var(--fb);color:#444}
  .ps-c b{display:block;margin-top:1mm;font:600 12pt/1.15 var(--fh);letter-spacing:.02em;overflow-wrap:anywhere}
  .ps-c span{display:block;margin-top:.5mm;font-size:8.5pt;line-height:1.3;color:#333;overflow-wrap:anywhere}
  .ps-logo{display:flex;align-items:center;gap:2.5mm}
  .ps-logo svg{flex:none;width:9mm;height:9mm;color:#000;--accent:var(--lk-brand,#14598A)}
  .ps-logo b{margin:0;font:700 15pt/1 var(--fh)}
  .ps-logo b i{font-style:normal;font-weight:700}
  .ps-logo small{margin-top:1mm}
  .ps-sec{margin-top:6mm}
  .ps-sec h2{display:flex;align-items:center;gap:2.5mm;padding-bottom:1.5mm;border-bottom:.8pt solid #000;font:600 13pt/1.1 var(--fh);letter-spacing:.02em;break-after:avoid}

/* a live theme switch: no colour transitions on hundreds of elements (removed two frames later) */
html.lk-switch *,html.lk-switch *::before,html.lk-switch *::after{transition:none!important}

/* contrast: thicker focus ring, every control outline clearly visible, underlines in full colour */
:root[data-theme="contrast"] :focus-visible{outline-width:3px}
:root[data-theme="contrast"] :is(.btn-q,.seg,.mseg,.listbtn,.lkbtn,.cc-copy,.opt span,.chip,.q-chip,.state,.q-empty,.anno){border-color:var(--ink-3)}
:root[data-theme="contrast"] :is(#cfg,#priv,#imp,#net){border-color:var(--ink-3)}

:root[data-theme="contrast"] :is(.lnk,.rm,.ask){text-decoration-color:currentColor}
/* the chosen "Nežinau" chip keeps its full ink outline (the contrast theme draws every other chip edge in ink-3) */

:root[data-theme="contrast"] .xs .ht{opacity:.8}

/* ---- text size: zoom the page content; utility bar and header stay 1:1 (they are tight on phones) ---- */
html[data-zoom="lg"]{--lk-z:1.1}
html[data-zoom="xl"]{--lk-z:1.2}
html[data-zoom] body>:not(dialog):not(.util):not(.hdr),html[data-zoom] dialog>*{zoom:var(--lk-z)}
/* inside a zoomed box lengths are scaled: sticky offsets and scroll margins under the (unzoomed) header are divided back,
   and so are viewport units that must keep their size */
html[data-zoom] .side,html[data-zoom] .q-side{top:calc(var(--hdr-h,72px) / var(--lk-z) + 24px)}
html[data-zoom] .cblock{scroll-margin-top:calc(var(--hdr-h,72px) / var(--lk-z) + 20px)}

}
/* the parameter sheet, the privacy note, Rekvizitai and the net calculator: the zoomed inner box keeps the dialog's
   on-screen height */
html[data-zoom] :is(#cfg,#priv,#imp,#net) .dlg-in{max-height:calc(min(88vh,820px) / var(--lk-z))}

}

  html[data-zoom="xl"] .num{grid-template-columns:36px minmax(0,1fr) 36px}

  html[data-zoom="xl"] .cfoot .step{grid-template-columns:38px minmax(0,1fr) 38px}

  html[data-density="compact"] .tile{aspect-ratio:1/1}

  /* 76 px tiles: no room for the item code and the list tick next to the drawing (the category heading names the group,
     the quantity stepper under the price shows what is on the list) */
  html[data-density="compact"] .tile :is(.code,.tick){display:none}
  html[data-density="compact"] .cdesc{font-size:13px}
  /* price and a square "+" button share one line (the button keeps its accessible name "Į sąrašą: …");

  html[data-density="compact"] .cfoot{padding-top:8px;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px}

  /* "Klausti apie šią įrangą" becomes a square icon link between the price and the "+" button (its accessible name
     stays "Klausti apie šią įrangą: …"); with a stepper it sits next to the price and the stepper takes the next line */
  html[data-density="compact"] .cfoot .pr{flex:1 1 0;min-width:0}
  html[data-density="compact"] .cfoot .ask{order:1;flex:0 0 auto;justify-content:center;width:44px;height:44px;min-height:44px;margin:0;border:1px solid var(--line-2);border-radius:3px;text-decoration:none}
  html[data-density="compact"] .cfoot .ask span{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  html[data-density="compact"] .cblock+.cblock{margin-top:24px;padding-top:22px}
  html[data-density="compact"] .ch{margin-bottom:6px}
  html[data-density="compact"] .hero-in{padding-top:24px;padding-bottom:24px}
  html[data-density="compact"] .trust li,html[data-density="compact"] .trust li+li{padding:16px 0}
  html[data-density="compact"] .f-top{padding:36px 0 28px;gap:24px}
}

#baLook{position:fixed;inset:var(--lk-top,80px) var(--lk-right,16px) auto auto;margin:0;width:min(calc(400px * var(--lk-z,1)),calc(100vw - 24px));max-height:calc(100vh - var(--lk-top,80px) - 16px);border:1px solid var(--line-2);border-radius:6px;box-shadow:0 22px 56px -22px rgba(0,0,0,.42),0 2px 8px -4px rgba(0,0,0,.16);overflow:hidden}

html[data-zoom] #baLook{max-height:calc(100vh - var(--lk-top,80px) - 16px)}

.lk-a{align-items:center;gap:7px}
.lk-ac{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:700 12.5px/1 var(--fb);letter-spacing:.02em;transition:box-shadow var(--t)}
.lk-a input:checked+.lk-ac{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
/* option cards (text size, density, motion) */
.lk-opts{display:grid;gap:8px}
.lk-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.lk-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.lk-ob{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:62px;padding:9px 8px;border:1px solid var(--field);border-radius:var(--r);text-align:center;color:var(--ink-2);transition:border-color var(--t),background-color var(--t)}
.lk-o:hover .lk-ob{border-color:var(--ink-3)}
.lk-o input:checked+.lk-ob{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:color-mix(in srgb,var(--ink) 5%,transparent);color:var(--ink)}
.lk-o input:focus-visible+.lk-ob{outline:2px solid var(--focus);outline-offset:2px}
.lk-ob b{font-size:14px;line-height:1.2;font-weight:600}
.lk-o input:checked+.lk-ob b{font-weight:700}
.lk-ob small{font-size:12.5px;line-height:1.25;color:var(--ink-3)}
.lk-aa{font:600 15px/1 var(--fb);color:var(--ink)}
.lk-aa.z2{font-size:18px}.lk-aa.z3{font-size:21px}
.lk-di{width:30px;height:22px;fill:none;stroke:currentColor;stroke-width:1.2;color:var(--ink)}
:root[data-theme="contrast"] .lk-ob{border-color:var(--ink-3)}
/* switch */
.lk-swr{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px;cursor:pointer}
.lk-swt{display:flex;flex-direction:column;gap:3px;min-width:0}
.lk-swt b{font-size:15px;line-height:1.25;font-weight:600}
.lk-swt small{font-size:13px;line-height:1.35;color:var(--ink-3)}
.lk-swi{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:46px;height:28px;margin:0;border:1.5px solid var(--field);border-radius:14px;background:var(--surface);cursor:pointer;transition:background-color var(--t),border-color var(--t)}
.lk-swi::before{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--ink-3);transition:transform var(--t) var(--ease),background-color var(--t)}
.lk-swi:checked{background:var(--ink);border-color:var(--ink)}
.lk-swi:checked::before{transform:translateX(18px);background:var(--surface)}
.lk-os{margin-top:10px;display:flex;gap:7px;align-items:flex-start;font-size:13px;line-height:1.4;color:var(--ink-3)}
.lk-os .ui{width:16px;height:16px;margin-top:1px}
/* panel footer */
.lk-f{position:relative;display:flex;flex-wrap:wrap;gap:10px;padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.lk-f .btn{flex:1 1 auto;min-height:44px;padding:0 16px}
.lk-f .dtoasts{bottom:calc(100% + 10px)}
@media (max-width:759px){
  .lk-h{padding:16px 60px 12px var(--gut)}
  .lk-s{padding:0 var(--gut) 16px}
  .lk-f{padding-left:var(--gut);padding-right:var(--gut)}
}
/* short viewports (landscape phones): slimmer panel header and footer, a taller sheet, so the options get the room */
@media (max-height:480px){
  .lk-h{padding-top:10px;padding-bottom:8px}
  .lk-h h2{font-size:23px}
  .lk-h p{margin-top:3px;font-size:12.5px;line-height:1.3}
  .lk-f{padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .lk-f .btn{min-height:40px}
  .lk .x{top:6px}
  #baLook,html[data-zoom] #baLook{max-height:calc(100vh - var(--lk-top,80px) - 8px)}
  html[data-zoom] #baLook .dlg-in{max-height:calc((100vh - var(--lk-top,80px) - 10px) / var(--lk-z))}
}
@media (max-height:480px) and (max-width:759px){
  #baLook,html[data-zoom] #baLook{max-height:90vh}
  html[data-zoom] #baLook .dlg-in{max-height:calc(90vh / var(--lk-z) - 2px)}
}
/* forced colours (Windows high contrast): previews and accent chips keep their real colours, chosen items get a
   Highlight ring (box-shadow survives only with forced-color-adjust:none), the switch keeps a visible knob */
@media (forced-colors: active){
  .lk-sw,.lk-ac{forced-color-adjust:none}
  .lk-sw{box-shadow:0 0 0 1px CanvasText}
  .lk-th input:checked+.lk-sw,.lk-a input:checked+.lk-ac{box-shadow:0 0 0 2px Canvas,0 0 0 5px Highlight}
  .lk-ck{background:Highlight;color:HighlightText;box-shadow:0 0 0 1.5px Canvas}
  .lk-ob{forced-color-adjust:none;background:Canvas;color:CanvasText;border-color:CanvasText}
  .lk-ob :is(b,small,.lk-aa,.lk-di){color:CanvasText}
  .lk-o input:checked+.lk-ob{border-color:Highlight;box-shadow:inset 0 0 0 2px Highlight;background:Canvas;color:CanvasText}
  .lk-swi{forced-color-adjust:none;border-color:CanvasText;background:Canvas}
  .lk-swi::before{background:CanvasText}
  .lk-swi:checked{background:Highlight;border-color:Highlight}
  .lk-swi:checked::before{background:HighlightText}
  /* these boxes opt out of forced colours, so their keyboard focus ring needs a system colour too */
  .lk input:focus-visible+:is(.lk-sw,.lk-ac,.lk-ob),.lk-swi:focus-visible{outline-color:CanvasText}
}
</style>

/* accepts 1,5 · 1.5 · " 1,50 " · spaces as thousands groups ("2 500"); German also writes groups with points, so in DE
   "1.500" / "1.500,5" / "12.345.678" are thousands (a point followed by exactly three digits, no leading 0), while
   "1.5" or "0.500" stay decimal points */
function num(v){
  let s=String(v).trim().replace(/\s+/g,"");
  if(lang==="de"&&/^[1-9]\d{0,2}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,"");
  /* English writes thousands with commas: "1,500" / "12,345.5" are thousands there, "1,5" stays a decimal comma */
  if(lang==="en"&&/^[1-9]\d{0,2}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,"");
  s=s.replace(",",".");
  return /^(\d+\.?\d*|\.\d+)$/.test(s)?parseFloat(s):NaN;
}

const cleanS=v=>String(v).replace(/[\u0000-\u001f\u007f]+/g," ").replace(/\s+/g," ").trim().slice(0,60);
/* keeps only known parameters of this type with valid values */
function cleanP(k,p){
  const o={};if(!p||typeof p!=="object"||Array.isArray(p))return o;
  (SPEC[k]||[]).forEach(id=>{const f=PF[id],v=p[id];if(v==null)return;
    if(f.t==="c"){if(Number.isInteger(v)&&v>=1&&v<=f.lt[2].length)o[id]=v}
    else if(f.t==="s"){if(typeof v==="string"){const s=cleanS(v);if(s)o[id]=s}}
    else if(typeof v==="number"&&Number.isFinite(v)&&(f.z?v>=0:v>0)&&(!f.min||v>=f.min)&&v<=f.max&&(f.t!=="i"||Number.isInteger(v)))o[id]=f.t==="i"?v:Math.round(v*100)/100});
  return o;
}
const pkey=p=>JSON.stringify(Object.keys(p).sort().map(x=>[x,p[x]]));
/* same type + identical parameters = one line (quantities add up); other parameters = a separate line */
function addLine(k,q,p){const m=cart.find(l=>l.k===k&&pkey(l.p)===pkey(p));if(m){m.q=Math.min(999,m.q+q);return m}const l={id:++nid,k,q:Math.min(999,q),p};cart.push(l);return l}
/* the list keeps at most MAXL lines (that is also what a reload restores): a new line is refused while it is full – the
   same item with identical parameters still adds to its quantity */
const fits=(k,p)=>cart.length<MAXL||cart.some(l=>l.k===k&&pkey(l.p)===pkey(p));
const linesOf=k=>cart.filter(l=>l.k===k);
const lineById=id=>cart.find(l=>l.id===+id);
const unitsOf=k=>linesOf(k).reduce((a,l)=>a+l.q,0);
const pfL=f=>f[lang]||f.lt;
function pVal(id,v){const f=PF[id];if(f.t==="c")return pfL(f)[2][v-1];if(f.t==="s")return v;return fmt(v,f.t==="i"?0:2)+(f.u?" "+f.u:"")}
/* net geometry (the calculator and the summary of a net line): pond L × W (or only the area A, taken as a square),
   overhang o on every side, post spacing s → net Ln × Wn, its area, the perimeter, posts at the corners and evenly along
   the sides (spacing ≤ s). Pure geometry, shown as orientation values. */
function netCalc(v){
  let L=v.L,W=v.W;if(v.m===1){if(!(v.A>0))return null;L=W=Math.sqrt(v.A)}
  if(!(L>0&&W>0))return null;
  const o=v.o>0?v.o:0,Ln=L+2*o,Wn=W+2*o,s=v.s>=1?v.s:0;
  return {L,W,o,Ln,Wn,area:Ln*Wn,per:2*(Ln+Wn),s,posts:s?2*(Math.ceil(Ln/s-1e-9)+Math.ceil(Wn/s-1e-9)):null};
}
/* value and unit stay on one line (no-break spaces), so do the net's two sides */
function netText(r){const d=D(),N="\u00a0";return `${d.nNet} ${fmt(r.Ln,2)}${N}×${N}${fmt(r.Wn,2)}${N}m (${fmt(Math.round(r.area),0)}${N}m²), ${d.nPer} ${fmt(r.per,1)}${N}m`+(r.posts?`, ${r.posts}${N}${pl(r.posts,d.postsW)}`:"")}
/* "Plotas: 1,5 ha", … – only what the visitor stated. A net line also gets its orientation values, but only when they add
   something (an overhang > 0 or a post spacing was given): from length × width, or – when only the area is known – as a
   square pond, and it says so */
function parSum(l){
  const s=(SPEC[l.k]||[]).filter(id=>l.p[id]!=null).map(id=>`${pfL(PF[id])[1]}: ${pVal(id,l.p[id])}`);
  if(l.k==="2-0"&&(l.p.over>0||l.p.pspace)){
    const lw=l.p.len>0&&l.p.wid>0,r=lw?netCalc({m:0,L:l.p.len,W:l.p.wid,o:l.p.over,s:l.p.pspace}):netCalc({m:1,A:l.p.narea,o:l.p.over,s:l.p.pspace});
    if(r)s.push(`${lw?D().parCalc:D().parCalcSq}: ${netText(r)}`);
  }
  return s;
}
/* accessible name of a line: the item, plus its parameters when the list holds the same item more than once */
function lname(l){const n=itemName(l.k);return linesOf(l.k).length>1?`${n} (${parSum(l).join(", ")||D().parNone})`:n}
/* request list: lines [{id, k:"<category>-<item>", q:1..999, p:{parameter:value}}], stored as "ba-list2" [{k,q,p?}]
   (ids are per page load); the first format "ba-list" {k:q} is still read, migrated once and then removed */
function save(){try{if(cart.length)localStorage.setItem("ba-list2",JSON.stringify(cart.map(l=>Object.keys(l.p).length?{k:l.k,q:l.q,p:l.p}:{k:l.k,q:l.q})));else localStorage.removeItem("ba-list2")}catch(e){}}
(function load(){
  let r2=null,r1=null;try{r2=localStorage.getItem("ba-list2");r1=localStorage.getItem("ba-list")}catch(e){return}
  let a=null;
  if(r2!=null)try{const v=JSON.parse(r2);if(Array.isArray(v))a=v}catch(e){}
  if(!a&&r1!=null)try{const c=JSON.parse(r1);if(c&&typeof c==="object"&&!Array.isArray(c))a=Object.keys(c).map(k=>({k,q:c[k]}))}catch(e){}
  (a||[]).slice(0,MAXL).forEach(x=>{if(x&&typeof x==="object"&&typeof x.k==="string"&&KEY.test(x.k)&&Number.isInteger(x.q)&&x.q>0&&x.q<1000)addLine(x.k,x.q,cleanP(x.k,x.p))});
  if(r1!=null){save();try{localStorage.removeItem("ba-list")}catch(e){}}
})();

  for(let c=s/2;c<w+h;c+=s){const t0=Math.max(0,c-w),t1=Math.min(h,c);if(t1>t0)d+=`M${R(x+c-t0)} ${R(y+t0)}L${R(x+c-t1)} ${R(y+t1)}`}return d}

/* ---------- render ---------- */
function render(){
  const d=D();document.documentElement.lang=lang;document.title=d.title;
  const md=document.querySelector('meta[name="description"]');if(md)md.setAttribute("content",d.metaDesc);
  $$("[data-t]").forEach(el=>{const v=d[el.dataset.t];if(typeof v==="string")el.textContent=v});
  $$("[data-ta]").forEach(el=>{const v=d[el.dataset.ta];if(typeof v==="string")el.setAttribute("aria-label",v)});
  $$(".seg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  const ls=$("#langSel");if(ls)ls.value=lang;
  $("#heroT").innerHTML=d.heroT.map(l=>`<span class="hl"><span>${esc(l)}</span></span>`).join(" ");
  $("#xsLg").innerHTML=d.sol.map((s,i)=>`<li><a href="#cat-${i}" data-m="${i+1}"><b>${nn(i)}</b><span>${esc(s[0])}</span></a></li>`).join("");
  $("#annoK").textContent=d.annoK;$("#annoD").textContent=d.annoD;
  $("#annoS").innerHTML=[0,.5,1,1.5].map(t=>`<span>${t?fmt(t,1,1):"0"}</span>`).join("");
  $("#trust").innerHTML=d.usp.map(u=>`<li>${ui(u[0])}<h3>${esc(u[1])}</h3><p>${u[2]}</p></li>`).join("");
  $("#fCats").innerHTML=d.sol.map((s,i)=>`<li><a href="#cat-${i}">${esc(s[0])}</a></li>`).join("");
  $("#legal2").textContent="© "+new Date().getFullYear()+" BaltAqua";
  /* Rekvizitai / Impressum: only what is known today (the company is being registered: no numbers are invented) */
  $("#impDl").innerHTML=d.impRows.map(r=>`<div><dt>${esc(r[0])}</dt><dd>${r[1]==="@mail"?'<a href="mailto:info@baltaqua.eu">info@baltaqua.eu</a>':esc(r[1])}</dd></div>`).join("");
  renderCatalog();renderSteps();
  $("#modeOpts").innerHTML=d.mode.map((m,i)=>{const v=i?"parts":"new";return `<label><input type="radio" name="mode" value="${v}"${mode===v?" checked":""}><span>${esc(m)}</span></label>`}).join("");
  radios("#countryOpts","country",d.country);radios("#farmOpts","farm",d.farm);radios("#powerOpts","power",[d.unkPh].concat(d.power),0);
  $("#need").placeholder=d.needPh;$("#pProb").placeholder=d.probPh;
  $("#pcH").innerHTML=pcHTML();
  ponds.forEach(P=>["a","d"].forEach(f=>{const n=num(P[f]);if(Number.isFinite(n))P[f]=fmtIn(n,PDIG[f])}));
  $("#draftSt").textContent="";
  renderPonds();showMode();syncList(null);
  if(cfgS&&$("#cfg").open){cfgS.p=readCfg(false).p;renderCfg()}
  if(netS&&$("#net").open)renderNet();
  if(tried)validate(false);
  if(outShown)buildOut();
  drawSection(true);
  document.dispatchEvent(new CustomEvent("ba:render",{detail:{lang}}));
}
function renderCatalog(){
  const d=D();
  $("#side").innerHTML=d.sol.map((s,i)=>`<a class="facet" href="#cat-${i}" data-c="${i}"><span><b>${nn(i)}</b>${esc(s[0])}</span><span class="n">${s[3].length}</span></a>`).join("");
  $("#chips").innerHTML=d.sol.map((s,i)=>`<a class="chip" href="#cat-${i}" data-c="${i}"><b>${nn(i)}</b>${esc(s[0])}</a>`).join("");
  $("#sol").innerHTML=d.sol.map((s,i)=>`<section class="cblock" id="cat-${i}" aria-labelledby="ch-${i}">
<div class="ch"><div><p class="ccode"><b>${nn(i)}</b> ${esc(s[0])}</p><h3 id="ch-${i}">${esc(s[1])}</h3><p>${esc(s[2])}</p></div>
${i===2?'<div class="ch-a">':""}<button type="button" class="in-list" data-act="open" data-c="${i}" hidden>${ui("u-list")}<span>${esc(d.inList)}</span><b>0</b></button>${i===2?`<button type="button" class="btn btn-q calc-b" data-act="net" aria-haspopup="dialog" aria-controls="net">${ui("u-calc")}<span>${esc(d.calcBtn)}</span></button></div>`:""}</div>
<div class="cgrid">${s[3].map((x,j)=>`<article class="card" aria-labelledby="it-${i}-${j}">
<div class="tile"><span class="code">${nn(i)}.${j+1}</span><span class="tick" data-tk="${i}-${j}" hidden></span>${art(i,j)}</div>
<div class="cbody"><div class="ctx"><h4 class="cname" id="it-${i}-${j}">${esc(x)}</h4><p class="cdesc">${esc(d.idesc[i][j])}</p></div>
<div class="cfoot"><div class="pr"><span class="pl">${esc(d.pl)}</span><span class="price">${esc(d.pq)}</span></div><div class="it-a" data-k="${i}-${j}"></div><a class="ask" data-k="${i}-${j}" href="mailto:info@baltaqua.eu" aria-label="${esc(d.askA+x)}">${ui("u-mail")}<span>${esc(d.ask)}</span></a><p class="c-pr p-only">${esc(d.catAsk)} ${esc(askFor(i+"-"+j))}</p></div></div></article>`).join("")}</div></section>`).join("");
  spy();
}
/* the print catalogue's "Užklausai nurodykite: plotas, gylis, …": the short labels, lower case in Lithuanian (mid-sentence),
   the fish weight from–to as one item */
function askFor(k){
  const d=D();
  return SPEC[k].filter(id=>id!=="gmax").map(id=>{const t=id==="gmin"?d.catW:pfL(PF[id])[1];return lang!=="de"&&id!=="gmin"?t.charAt(0).toLocaleLowerCase(loc())+t.slice(1):t}).join(", ");
}
function renderSteps(){
  /* the real process in three steps (hero strip, the "Kaip dirbame" link target) */
  const d=D();
  $("#steps").innerHTML=d.steps.map((s,i)=>`<li><span class="fl-n" aria-hidden="true">${i+1}</span><div class="fl-t"><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div></li>`).join("");
